{% extends "base.html" %}
{% block title %}管理员登录 · {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5 col-lg-4">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <div class="hero-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
          <h4 class="fw-bold mb-1 text-gradient">管理员入口</h4>
          <p class="text-muted small mb-0">{{ site_name }}</p>
        </div>
        <form method="post" action="{{ url_for('admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label small text-muted">账号</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control bg-light border-0" required autofocus placeholder="管理员账号">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small text-muted">密码</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-0"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control bg-light border-0" required placeholder="密码">
            </div>
          </div>
          <button class="btn btn-grad w-100 py-2 rounded-3 fw-semibold" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>登录
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('index') }}" class="small text-decoration-none text-muted">
            <i class="bi bi-arrow-left"></i> 返回前台
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
