{% extends "base.html" %}
{% block title %}管理员登录 · {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock text-warning" style="font-size:2.2rem"></i>
          <h4 class="mt-2 mb-0 fw-bold">管理员入口</h4>
          <p class="text-muted small mb-0">{{ site_name }}</p>
        </div>
        <form method="post" action="{{ url_for('admin_login') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <div class="mb-3">
            <label class="form-label">账号</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">登录</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('index') }}" class="small text-decoration-none">
            <i class="bi bi-arrow-left"></i> 返回前台
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
