<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    :root{
      --brand-1:#6366f1; --brand-2:#8b5cf6; --brand-3:#ec4899;
      --ink:#1f2430; --muted:#8a90a2;
    }
    *{ -webkit-font-smoothing:antialiased; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 560px at 100% -10%, rgba(139,92,246,.12), transparent 60%),
        radial-gradient(900px 480px at -10% 0%, rgba(99,102,241,.12), transparent 55%),
        #f6f7fb;
      min-height: 100vh;
    }
    .text-gradient{
      background: linear-gradient(90deg, var(--brand-1), var(--brand-2), var(--brand-3));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .btn-grad{
      background: linear-gradient(90deg, var(--brand-1), var(--brand-2));
      border: 0; color: #fff;
    }
    .btn-grad:hover{ filter: brightness(1.06); color: #fff; }
    .btn-grad.copied{ background: linear-gradient(90deg,#16a34a,#22c55e); }

    /* 顶部导航 */
    .topbar{ box-shadow: 0 1px 0 rgba(0,0,0,.06); backdrop-filter: blur(6px); }
    .brand-logo{
      width:34px; height:34px; border-radius:10px; display:inline-grid; place-items:center;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-3)); color:#fff; font-size:1.05rem;
    }

    /* Hero */
    .hero{
      background: linear-gradient(120deg, var(--brand-1), var(--brand-2) 55%, var(--brand-3));
      overflow: hidden;
    }
    .hero-bg{ position:absolute; inset:0; }
    .hero-bg::before, .hero-bg::after{
      content:""; position:absolute; border-radius:50%; filter: blur(8px); opacity:.35;
      background: rgba(255,255,255,.55);
    }
    .hero-bg::before{ width:220px; height:220px; top:-70px; right:8%; }
    .hero-bg::after{ width:160px; height:160px; bottom:-60px; left:10%; opacity:.25; }
    .hero-icon{
      width:64px; height:64px; border-radius:18px; margin:0 auto;
      display:grid; place-items:center; font-size:2rem; color:#fff;
      background: rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
    }
    .search-wrap{ max-width: 560px; }
    .search-wrap .form-control{ padding:.8rem 1rem; }
    .search-wrap .input-group-text{ border-radius: .75rem 0 0 .75rem; }
    .search-wrap .btn{ border-radius: 0 .75rem .75rem 0; }

    /* 文案卡片 */
    .copy-card{ transition: transform .15s ease, box-shadow .15s ease; border-radius: 1rem !important; }
    .copy-card:hover{ transform: translateY(-4px); box-shadow: 0 .75rem 1.5rem rgba(79,70,229,.15) !important; }
    .copy-content{ white-space: pre-wrap; word-break: break-word; font-size:.95rem; max-height: 9.5rem; overflow:auto; }
    .doc-ico{
      width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:#fff; font-size:.95rem;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    }
    .section-title{ letter-spacing:.3px; }

    /* 空状态 */
    .empty-ico{
      width:96px; height:96px; border-radius:50%; margin:0 auto; display:grid; place-items:center;
      font-size:2.6rem; color: var(--brand-2); background: rgba(139,92,246,.10);
    }
  </style>
</head>
<body>
  {% block nav %}{% endblock %}
  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show rounded-3 border-0 shadow-sm" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
